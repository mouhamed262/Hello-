<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I'm Sorry</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700&family=Great+Vibes&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    height:100vh; width:100vw; overflow:hidden;
    background: linear-gradient(135deg, #ffc8dd, #ff4d8d);
    display:flex; justify-content:center; align-items:center;
    font-family:'Cairo', sans-serif;
  }
  /* الصفحة 1 - الوردية الفخمة */
  #page1{
    position:fixed; inset:0; z-index:10;
    background: radial-gradient(circle at center, #fff0f5 0%, #ff8fab 50%, #ff4d8d 100%);
    display:flex; flex-direction:column; justify-content:center; align-items:center;
  }
  #page1 h1{font-family:'Great Vibes', cursive; font-size:80px; color:#7a0c2e; margin-bottom:25px; text-shadow:0 2px 10px rgba(255,255,255,0.8);}
  #openBtn{
    padding:16px 70px; border-radius:50px; border:3px solid white;
    background:#7a0c2e; color:white; font-size:23px; font-weight:700;
    cursor:pointer; box-shadow:0 10px 30px rgba(122,12,46,0.4);
  }
  /* الصفحة 2 - الأرقام */
  #page2{display:none; flex-direction:column; gap:22px; z-index:5;}
  .numBox{
    width:320px; height:80px; background:rgba(255,255,255,0.85); backdrop-filter:blur(10px);
    border:2px solid white; border-radius:25px;
    display:flex; justify-content:center; align-items:center;
    font-size:34px; font-weight:700; color:#7a0c2e; cursor:pointer;
    box-shadow:0 8px 25px rgba(0,0,0,0.1); transition:0.2s;
  }
  .numBox:active{transform:scale(0.95)}
  /* الصفحة 3 - الرسالة والوردة */
  #page3{
    display:none; position:fixed; inset:0; z-index:20;
    background: linear-gradient(180deg, #fff0f5, #ffc8dd);
    flex-direction:column; justify-content:center; align-items:center;
  }
  #roseBtn{font-size:95px; border:none; background:none; cursor:pointer; animation: pulse 1.3s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1)} 50%{transform:scale(1.2)}}
  #sorryText{display:none; font-family:'Great Vibes', cursive; font-size:85px; color:#c9184a;}
  .falling{position:fixed; top:-40px; pointer-events:none; z-index:100;}
</style>
</head>
<body>

<div id="page1">
  <h1>For You</h1>
  <button id="openBtn">OPEN</button>
</div>

<div id="page2">
  <div class="numBox">1</div>
  <div class="numBox">2</div>
  <div class="numBox">3</div>
</div>

<div id="page3">
  <p style="font-size:28px; color:#7a0c2e; margin-bottom:15px; font-weight:700;">مرحبا، اضغط على الوردة 🌹</p>
  <button id="roseBtn">🌹</button>
  <h1 id="sorryText">I'm sorry</h1>
  <button onclick="location.reload()" style="display:none; margin-top:20px; padding:10px 30px; border-radius:20px; border:none; background:#7a0c2e; color:white;" id="backBtn">رجوع</button>
</div>
